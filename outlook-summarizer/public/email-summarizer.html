<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Summarizer</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 0;
            margin: 0;
            max-width: 100%;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background-color: #f3f2f1;
        }

        * {
            box-sizing: border-box;
        }

        .header {
            background-color: #0078d4;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
        }

        .settings-icon {
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 18px;
            position: relative;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .user-bubble {
            background-color: #e1f0ff;
            color: #333;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .system-bubble {
            background-color: white;
            color: #333;
            border-bottom-left-radius: 4px;
            margin-right: auto;
        }

        .loading-bubble {
            background-color: white;
            color: #666;
            border-bottom-left-radius: 4px;
            margin-right: auto;
            display: flex;
            align-items: center;
        }

        .loading-dots {
            display: flex;
            align-items: center;
            column-gap: 4px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background-color: #0078d4;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.3s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.6s;
        }

        .input-container {
            padding: 12px 16px;
            background-color: white;
            border-top: 1px solid #e1e1e1;
            display: flex;
            gap: 8px;
        }

        .input-box {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d2d2d2;
            border-radius: 20px;
            resize: none;
            max-height: 120px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .input-box:focus {
            border-color: #0078d4;
        }

        .send-button {
            background-color: #0078d4;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: flex-end;
        }

        .send-button:hover {
            background-color: #106ebe;
        }

        .send-button:disabled {
            background-color: #c8c8c8;
            cursor: not-allowed;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .action-button {
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-button:hover {
            background-color: #106ebe;
        }

        .action-button:disabled {
            background-color: #c8c8c8;
            cursor: not-allowed;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Email Summarizer</h1>
        <div class="settings-icon">⚙️</div>
    </div>
    
    <div id="chatContainer" class="chat-container">
        <div class="chat-bubble system-bubble">
            Hello! I can help you summarize your emails. Click the button below to summarize the current email.
        </div>

        <div class="button-container">
            <button id="summarizeButton" class="action-button">Summarize Email</button>
        </div>
    </div>
    
    <div class="input-container">
        <textarea id="userInput" class="input-box" placeholder="Ask a question about the email..."></textarea>
        <button id="sendButton" class="send-button">➤</button>
    </div>
    
    <script>
        // Initialize Office
        Office.onReady(function() {
            // Once Office is ready
            document.getElementById('summarizeButton').addEventListener('click', summarizeEmail);
            document.getElementById('sendButton').addEventListener('click', sendUserMessage);
            document.getElementById('userInput').addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendUserMessage();
                }
            });
        });
        
        // Function to summarize email (UI demo only for now)
        function summarizeEmail() {
            const chatContainer = document.getElementById('chatContainer');
            const summarizeButton = document.getElementById('summarizeButton');
            
            // Disable button during "processing"
            summarizeButton.disabled = true;
            
            // Add user request to chat
            const userBubble = document.createElement('div');
            userBubble.className = 'chat-bubble user-bubble';
            userBubble.textContent = 'Please summarize this email for me.';
            chatContainer.appendChild(userBubble);
            
            // Add loading indicator
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'chat-bubble loading-bubble';
            loadingBubble.innerHTML = `
                <div class="loading-dots">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            `;
            chatContainer.appendChild(loadingBubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Simulate processing time - we'll replace this with real email processing later
            setTimeout(() => {
                // Remove loading bubble
                chatContainer.removeChild(loadingBubble);
                
                // Add response
                const responseBubble = document.createElement('div');
                responseBubble.className = 'chat-bubble system-bubble';
                responseBubble.innerHTML = `
                    <strong>Email Summary:</strong><br>
                    This is a placeholder summary of the email. In a real implementation, 
                    I would analyze the email content and provide a concise summary highlighting 
                    the key points and any action items.
                `;
                chatContainer.appendChild(responseBubble);
                
                // Re-enable button
                summarizeButton.disabled = false;
                
                // Scroll to the bottom of the chat
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 2000);
        }
        
        // Function to send a user message (UI demo only)
        function sendUserMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if (message) {
                const chatContainer = document.getElementById('chatContainer');
                
                // Add user message
                const userBubble = document.createElement('div');
                userBubble.className = 'chat-bubble user-bubble';
                userBubble.textContent = message;
                chatContainer.appendChild(userBubble);
                
                // Clear input
                userInput.value = '';
                
                // Add loading indicator
                const loadingBubble = document.createElement('div');
                loadingBubble.className = 'chat-bubble loading-bubble';
                loadingBubble.innerHTML = `
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                `;
                chatContainer.appendChild(loadingBubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // Simulate response - will replace with real implementation later
                setTimeout(() => {
                    // Remove loading bubble
                    chatContainer.removeChild(loadingBubble);
                    
                    // Add mock response based on what user asked
                    const responseBubble = document.createElement('div');
                    responseBubble.className = 'chat-bubble system-bubble';
                    
                    // Simple keyword matching for demo purposes
                    if (message.toLowerCase().includes('who')) {
                        responseBubble.textContent = 'This email is from John Smith (john.smith@example.com).';
                    } else if (message.toLowerCase().includes('when') || message.toLowerCase().includes('date')) {
                        responseBubble.textContent = 'This email was sent on May 10, 2023 at 2:15 PM.';
                    } else if (message.toLowerCase().includes('action') || message.toLowerCase().includes('need')) {
                        responseBubble.textContent = 'Yes, there appears to be an action item: Please respond with your availability for the meeting next Tuesday.';
                    } else {
                        responseBubble.textContent = 'I\'m sorry, I\'m just a UI demo right now. When fully implemented, I\'ll be able to answer specific questions about the email.';
                    }
                    
                    chatContainer.appendChild(responseBubble);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }, 1500);
            }
        }
    </script>
</body>
</html>
